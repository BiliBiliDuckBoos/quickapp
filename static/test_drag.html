<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>drag-diag2</title></head>
<body style="margin:0">
<div id="RESULT" style="position:fixed;left:4px;top:2px;z-index:99;background:#000;color:#0f0;font:13px/1.5 Consolas;padding:6px 8px;max-width:820px;white-space:pre-wrap;height:850px;overflow:auto">PENDING</div>
<iframe id="f" src="/editor?id=1787476976980_%E7%A5%9E" style="width:1400px;height:820px;border:0"></iframe>
<script>
var log = [];
function out(k, v) { log.push(k + ': ' + v); document.getElementById('RESULT').textContent = log.join('\n'); }
function frame() { return document.getElementById('f'); }

setTimeout(function () {
  var d = frame().contentDocument, w = d.defaultView;
  try {
    var ws = w.Blockly.getMainWorkspace();
    out('main-ws', !!ws);
    var xmlStr = '<xml xmlns="https://developers.google.com/blockly/xml">' +
      '<block type="vela_text" x="700" y="40"><field name="NAME">D1</field><field name="CONTENT">D1TXT</field><field name="BIND"></field><field name="SIZE">20</field><field name="COLOR">#333333</field><field name="X">20</field><field name="Y">30</field></block></xml>';
    w.Blockly.Xml.domToWorkspace(w.Blockly.Xml.textToDom(xmlStr), ws);
    out('injected', 'ok');
    ws.addChangeListener(function (ev) {
      if (ev.type === w.Blockly.Events.BLOCK_CHANGE && ev.name === 'X') {
        out('CHANGE-X', ev.oldValue + ' -> ' + ev.newValue);
      }
      if (ev.type === w.Blockly.Events.BLOCK_CREATE) {
        var ids = ev.ids || (ev.blockId ? [ev.blockId] : []);
        out('CREATE', ids.length + '个 ' + (ev.recordUndo ? '(undoable)' : ''));
      }
      if (ev.type === w.Blockly.Events.BLOCK_DELETE) {
        out('DELETE', JSON.stringify(ev.ids || [ev.blockId]).slice(0, 60));
      }
    });
  } catch (e) { out('stage1-err', e.message); }

  setTimeout(function () {
    var d2 = frame().contentDocument, w2 = d2.defaultView;
    try {
      var t = null;
      d2.querySelectorAll('.pv-editable').forEach(function (elx) { if (elx.dataset.cname === 'D1') t = elx; });
      out('found', !!t);
      if (!t) { document.getElementById('RESULT').textContent = log.join('\n'); return; }
      out('style', (t.getAttribute('style') || '').slice(0, 90));

      var r = t.getBoundingClientRect();
      t.dispatchEvent(new w2.PointerEvent('pointerdown', { clientX: r.left + 5, clientY: r.top + 5, bubbles: true, cancelable: true }));
      w2.dispatchEvent(new w2.PointerEvent('pointermove', { clientX: r.left + 55, clientY: r.top + 65, bubbles: true, cancelable: true }));
      w2.dispatchEvent(new w2.PointerEvent('pointerup', { clientX: r.left + 55, clientY: r.top + 65, bubbles: true, cancelable: true }));

      var blk = null;
      w2.Blockly.getMainWorkspace().getAllBlocks(false).forEach(function (b) {
        if (b.type === 'vela_text' && (b.getFieldValue('NAME') || '').trim() === 'D1') blk = b;
      });
      out('X-sync-after-up', blk ? blk.getFieldValue('X') : 'no-block');

      setTimeout(function () {
        var d3 = frame().contentDocument, w3 = d3.defaultView;
        var blk3 = null;
        w3.Blockly.getMainWorkspace().getAllBlocks(false).forEach(function (b) {
          if (b.type === 'vela_text' && (b.getFieldValue('NAME') || '').trim() === 'D1') blk3 = b;
        });
        out('X-after-1s', blk3 ? blk3.getFieldValue('X') + ',' + blk3.getFieldValue('Y') : 'no-block');
        var t3 = null;
        d3.querySelectorAll('.pv-editable').forEach(function (elx) { if (elx.dataset.cname === 'D1') t3 = elx; });
        if (t3) out('pos-after', w3.getComputedStyle(t3).left + ',' + w3.getComputedStyle(t3).top);
        document.getElementById('RESULT').textContent = log.join('\n');
      }, 1200);
    } catch (e) { out('stage2-err', e.message); document.getElementById('RESULT').textContent = log.join('\n'); }
  }, 1600);
}, 6000);
</script>
</body>
</html>
